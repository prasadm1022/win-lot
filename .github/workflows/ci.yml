# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Runtime budgets of docs/MODEL-V2.md 8.1 item 11 (exits 1 over budget: all lotteries 20 s, synthetic 10 s).
      - run: npm run bench:model
      - run: npm run build
      # The copy rules on the built pages (docs/MODEL-V2.md 6): out/ exists only now, so `npm test` above skipped that
      # check. REQUIRE_BUILT_PAGES makes a missing out/ a failure instead of a skip.
      - name: Copy rules on the built pages
        run: npx vitest run test/model-v2.copy.test.ts test/ads.built.test.ts
        env:
          REQUIRE_BUILT_PAGES: "1"
